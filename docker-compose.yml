services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: fr4iser/portfolio:latest
    container_name: portfolio
    ports:
      - "3000:3000"
    volumes:
      - portfolio_logs:/app/logs
      - portfolio_private_data:/app/private/data
      - portfolio_public_data:/app/public/data
      - portfolio_uploads:/app/public/uploads
      - portfolio_auth:/app/auth-state
    environment:
      - NODE_ENV=production
      - ENABLE_AUTH=true
      - AUTH_STATE_DIR=/app/auth-state
    restart: unless-stopped

volumes:
  portfolio_logs:
    driver: local
  portfolio_private_data:
    driver: local
  portfolio_public_data:
    driver: local
  portfolio_uploads:
    driver: local
  portfolio_auth:
    driver: local
